[package]
name = "pearmail"
version = "0.1.0"
edition = "2021"
description = "Pear Mail, an email client"
authors = ["Roman Gelman"]
repository = "https://github.com/romanmgelman/pearmail"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
tokio-native-tls = "0.3"
native-tls = "0.2"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-native-tls"] }
mail-parser = "0.11"
keyring = { version = "3", features = ["windows-native"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
futures = "0.3"
base64 = "0.22"
dirs = "6"
rusqlite = { version = "0.42.0", features = ["bundled"] }
lol_html = "3.0.3"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-single-instance = "2.5.5"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }
getrandom = "0.2"
sha2 = "0.11.1"
windows = { version = "0.62", features = ["UI_Notifications", "Data_Xml_Dom", "Foundation", "Win32_System_Com"] }
winreg = "0.56.0"
socket2 = { version = "0.6", features = ["all"] }

# Image decoding is far too slow unoptimized; optimize dependencies in dev builds too.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# Local fix to the IMAP parser: accept NIL body encodings (sent by iCloud) in BODYSTRUCTURE.
[patch.crates-io]
imap-proto = { path = "vendor/imap-proto" }
